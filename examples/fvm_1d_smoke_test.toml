# FVM Euler 1D Solver - example invocation via q8020-sweeper 

[global]
_slurm = true
_run_mode = "parallel"
_slurm_submit = true
_slurm_project = "frontier_project"
_output_dir = "/data/q8020"
_env = "./fvm_euler_1d_solver/.venv"
_script = """\
source ./fvm_euler_1d_solver/.venv/bin/activate && \
python3 ./fvm_euler_1d_solver/nozzle_1d_solver.py\
"""
_case_postproc = [
    "source ./fvm_euler_1d_solver/.venv/bin/activate && python3 ./q8020-cfd-experiments/codes/fvm_euler_1d_nozzle/fvm_euler_1d_solver_harvester.py"
]
_inject_outdir = "-outdir"
"-nelem" = 200
"-time_scheme" = "BDF1"
"-cfl" = "1e5"
"-localdt" = true
"-noshow" = true

[ideal]

[shots]
"-shots" = 1024 

[fake_real]
"-backend" = "fake fake_guadalupe"
"-shots" = 1024 





